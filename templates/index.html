<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenador de Algoritmos</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-xl">
            <h1 class="text-3xl font-bold text-gray-800 text-center mb-6">Ordenador de Algoritmos</h1>

            <div class="mb-4">
                <label for="algoritmo" class="block text-gray-700 font-semibold mb-2">Seleccione un algoritmo</label>
                <select id="algoritmo" class="w-full p-2 border border-gray-300 rounded">
                    <option value="quick">Quick Sort</option>
                    <option value="bubble">Bubble Sort</option>
                    <option value="merge">Merge Sort</option>
                    <option value="heapsort">Heap Sort</option>
                    <option value="timsort">Tim Sort</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="array" class="block text-gray-700 font-semibold mb-2">Ingrese los números (separados por coma)</label>
                <input type="text" id="array" class="w-full p-2 border border-gray-300 rounded" placeholder="Ej: 5, 3, 8, 1">
            </div>

            <div class="flex justify-center">
                <button onclick="ordenar()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">Ordenar</button>
            </div>

            <div class="mt-6">
                <h2 class="text-xl font-semibold text-gray-800">Resultado:</h2>
                <p id="resultado" class="text-gray-700 mt-2"></p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
